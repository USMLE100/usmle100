name: probe-route-check
on: { push: { branches: [probe-route-check] } }
permissions: { statuses: write, contents: write }
jobs:
  iphone:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Screenshot the live homepage as an iPhone (Safari engine), read-only
        run: |
          npm i --no-save playwright@1.48.2 >/dev/null 2>&1 && npx playwright install --with-deps webkit >/dev/null 2>&1
          node .github/iphone.cjs || true
          git config user.email noreply@anthropic.com; git config user.name Claude
          git add shots && git commit -qm "iPhone screenshots of the live homepage (reference)" && git push -q origin HEAD:probe-route-check
