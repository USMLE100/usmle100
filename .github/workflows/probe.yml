name: probe-route-check
on: { push: { branches: [probe-route-check] } }
permissions: { statuses: write, contents: read }
jobs:
  sandbox-purchase:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Stripe TEST-mode purchase on staging (no real money; production untouched)
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          true
          node .github/sandbox-purchase.cjs > out.txt 2>&1 || true
          cat out.txt
          i=0; while IFS= read -r line; do i=$((i+1)); gh api repos/${{ github.repository }}/statuses/${{ github.sha }} -f state=success -f context="step$i" -f description="$(echo "$line" | cut -c1-138)" >/dev/null; done < <(grep '^RESULT' out.txt | head -12)
