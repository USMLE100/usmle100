name: probe-route-check
on: { push: { branches: [probe-route-check] } }
permissions: { statuses: write, contents: write }
jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Capture the original V12 landing page and Build v4 loading screen (read-only)
        run: |
          npm i --no-save playwright@1.48.2 >/dev/null 2>&1 && npx playwright install --with-deps chromium >/dev/null 2>&1
          node .github/capture.cjs || true
          ls -la cap | head -50
      - name: Store the capture on this branch (reference files only)
        run: |
          rm -rf cap/*-video
          find cap -size +3M -delete
          git config user.email noreply@anthropic.com; git config user.name Claude
          git add cap && git commit -qm "Reference capture of original V12 and Build v4 pages" && git push -q origin HEAD:probe-route-check
