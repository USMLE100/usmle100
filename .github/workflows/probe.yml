name: probe-route-check
on: { push: { branches: [probe-route-check] } }
permissions: { statuses: write, contents: write }
jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Read-only check of the live site
        run: |
          sleep 120
          node .github/live-polish.cjs || true
          git config user.email noreply@anthropic.com; git config user.name Claude
          git add shots && git commit -qm "Live check (read-only)" && git push -q origin HEAD:probe-route-check
